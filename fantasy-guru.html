<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Guru</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="root" src="/desktop-fixed.html?matchup=2"></iframe><script>
const root=document.getElementById('root');
function boot(){
 const outer=root.contentDocument;if(!outer)return;
 const base=outer.getElementById('base');if(!base){setTimeout(boot,100);return}
 const enterBase=()=>{const mid=base.contentDocument;if(!mid)return;const guru=mid.getElementById('guru');if(!guru){setTimeout(enterBase,100);return}const install=()=>{const d=guru.contentDocument,w=guru.contentWindow;if(!d||!w)return;
  if(d.getElementById('fgMatchupEspnStyle'))return;
  const style=d.createElement('style');style.id='fgMatchupEspnStyle';style.textContent=`
   #matchupCard{padding:10px!important;overflow:auto!important;height:calc(100vh - 105px)!important}
   #matchupCard>h2{font-size:18px!important;margin:0 0 7px!important}
   #fgLeagueScoreStrip{display:flex;gap:6px;overflow-x:auto;padding:0 0 7px;margin-bottom:7px;scrollbar-width:thin}
   .fgScoreTile{flex:0 0 156px;background:#0b1525;border:1px solid #26364f;border-radius:9px;padding:7px 8px}.fgScoreTile.mine{border-color:#38bdf8}.fgScoreName{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fgScorePts{font-size:16px;font-weight:950;margin-top:2px}.fgScoreMeta{font-size:9px;color:#94a3b8;margin-top:1px}
   #fgMatchBody{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:9px;align-items:start}.fgMatchMain{min-width:0}.fgMatchRail{background:#07101d;border:1px solid #26364f;border-radius:11px;padding:9px;max-height:calc(100vh - 185px);overflow:auto}.fgRailTitle{font-size:12px;font-weight:950;margin:0 0 5px}.fgRailRow{padding:6px 0;border-bottom:1px solid #26364f}.fgRailRow:last-child{border-bottom:0}.fgRailRow b{font-size:11px}.fgRailSmall{font-size:9px;color:#94a3b8;margin-top:2px;line-height:1.25}.fgRailLink{color:#dbeafe;text-decoration:none}.fgRailLink:hover{color:#7dd3fc}
   #fgMatchSummary{background:#0b1525;border:1px solid #26364f;border-radius:11px;padding:9px 12px;margin-bottom:8px}.fgVsGrid{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:center;gap:10px}.fgVsTeam{text-align:center}.fgVsTeam .name{font-size:18px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fgVsTeam .actual{font-size:34px;font-weight:950;line-height:1;margin-top:3px}.fgVsTeam .proj{font-size:10px;color:#94a3b8;margin-top:3px}.fgVsCenter{text-align:center}.fgVsCenter b{font-size:13px}.fgEdge{margin-top:7px;padding-top:7px;border-top:1px solid #26364f;text-align:center;font-size:10px;color:#cbd5e1}.fgEdge strong{color:#86efac}
   #matchupBox>.matchHead{display:none!important}.lineupCompare{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:7px!important;margin-top:0!important}.lineupSide{padding:7px!important;border-radius:9px!important}.lineupTitle{font-size:12px!important;margin-bottom:3px!important}.lineupHeader,.lineupPlayer{grid-template-columns:46px minmax(0,1fr) 54px 58px!important;gap:5px!important}.lineupHeader{font-size:8px!important;padding:2px 0 3px!important}.lineupPlayer{padding:3px 0!important;min-height:27px!important}.slotTag{font-size:9px!important}.playerMeta{font-size:8px!important}.actualPts{font-size:12px!important}.projPts{font-size:10px!important}.benchTitle{font-size:10px!important;margin:5px 0 2px!important;color:#7dd3fc!important}.matchHighlights{margin-top:7px!important}.matchHighlight{grid-template-columns:130px 1fr 50px!important;padding:4px 0!important;font-size:10px!important}
   @media(max-width:1050px){#fgMatchBody{grid-template-columns:1fr}.fgMatchRail{display:none}}@media(max-width:760px){.fgVsGrid{grid-template-columns:1fr}.lineupCompare{grid-template-columns:1fr!important}.fgVsTeam .actual{font-size:28px}}
  `;d.head.appendChild(style);
  const card=d.getElementById('matchupCard'),box=d.getElementById('matchupBox');if(!card||!box)return;
  const h=card.querySelector('h2');if(h)h.textContent='⚔️ Matchup Center';
  const strip=d.createElement('div');strip.id='fgLeagueScoreStrip';card.insertBefore(strip,box);
  const body=d.createElement('div');body.id='fgMatchBody';const main=d.createElement('div');main.className='fgMatchMain';const rail=d.createElement('aside');rail.className='fgMatchRail';body.append(main,rail);box.before(body);main.appendChild(box);
  const summary=d.createElement('div');summary.id='fgMatchSummary';box.insertBefore(summary,box.firstChild);
  let publicGames=[],publicNews=[],busy=false,timer=null;
  const val=x=>Number.isFinite(Number(x))?Number(x):null;
  const actualForTeam=t=>{const pts=(t.players||[]).filter(p=>p.starter!==false&&String(p.lineup_slot||'').toUpperCase()!=='BN').map(p=>val(p.actual_weekly_points)).filter(x=>x!==null);return pts.length?pts.reduce((a,b)=>a+b,0):null};
  function render(){if(busy)return;busy=true;try{let C=null,m=null;try{C=w.eval('C');m=w.eval('matchupData')}catch{};if(!C){strip.innerHTML='';summary.innerHTML='<div class="fgRailSmall">Choose a league to load the matchup.</div>';return}
    const teams=C.league_teams||[];const scoreMap=new Map();for(const t of teams){const a=actualForTeam(t);if(a!==null)scoreMap.set(t.team,a)}if(m?.available){scoreMap.set(m.you.team,val(m.you.actual)||0);scoreMap.set(m.them.team,val(m.them.actual)||0)}
    strip.innerHTML=teams.map(t=>'<div class="fgScoreTile '+(t.team===C.my_team.team?'mine':'')+'"><div class="fgScoreName">'+t.team+'</div><div class="fgScorePts">'+(scoreMap.has(t.team)?scoreMap.get(t.team).toFixed(1):'—')+'</div><div class="fgScoreMeta">'+(t.record?.wins??0)+'-'+(t.record?.losses??0)+'</div></div>').join('');
    if(m?.available){const ya=val(m.you.actual)||0,ta=val(m.them.actual)||0,yp=val(m.you.projection),tp=val(m.them.projection),edge=(yp!==null&&tp!==null)?yp-tp:null;let edgeText='Projection edge unavailable';if(edge!==null)edgeText=edge===0?'Projected even':(edge>0?'<strong>'+m.you.team+' +'+edge.toFixed(1)+'</strong> projected edge':'<strong>'+m.them.team+' +'+Math.abs(edge).toFixed(1)+'</strong> projected edge');summary.innerHTML='<div class="fgVsGrid"><div class="fgVsTeam"><div class="name">'+m.you.team+'</div><div class="actual">'+ya.toFixed(1)+'</div><div class="proj">Projected '+(yp===null?'—':yp.toFixed(1))+'</div></div><div class="fgVsCenter"><b>VS</b><div class="fgRailSmall">Week '+C.current_week+'</div></div><div class="fgVsTeam"><div class="name">'+m.them.team+'</div><div class="actual">'+ta.toFixed(1)+'</div><div class="proj">Projected '+(tp===null?'—':tp.toFixed(1))+'</div></div></div><div class="fgEdge">'+edgeText+'</div>'}else summary.innerHTML='<div class="fgRailSmall">Loading live matchup data…</div>';
    let r='<div class="fgRailTitle">NFL Scoreboard</div>';if(publicGames.length)r+=publicGames.slice(0,8).map(e=>{const c=e.competitions?.[0],a=c?.competitors||[],away=a.find(x=>x.homeAway==='away'),home=a.find(x=>x.homeAway==='home'),st=c?.status?.type?.shortDetail||'',as=away?.score??'',hs=home?.score??'';return'<div class="fgRailRow"><b>'+(away?.team?.abbreviation||'Away')+' '+as+' · '+(home?.team?.abbreviation||'Home')+' '+hs+'</b><div class="fgRailSmall">'+st+'</div></div>'}).join(''):r+='<div class="fgRailSmall">Loading NFL games…</div>';if(publicNews.length){r+='<div class="fgRailTitle" style="margin-top:10px">Fantasy / NFL News</div>'+publicNews.slice(0,5).map(a=>'<div class="fgRailRow"><a class="fgRailLink" href="'+(a.links?.web?.href||'#')+'" target="_blank" rel="noopener"><b>'+a.headline+'</b></a></div>').join('')}rail.innerHTML=r;
  }finally{busy=false}}
  async function loadPublic(){try{const [s,n]=await Promise.all([fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard').then(r=>r.json()),fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=6').then(r=>r.json())]);publicGames=s.events||[];publicNews=n.articles||[]}catch{}render()}
  const mo=new w.MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(render,80)});mo.observe(card,{childList:true,subtree:true,characterData:true});render();loadPublic();setInterval(render,5000);
 };if(guru.contentDocument?.readyState==='complete')install();guru.addEventListener('load',install);setTimeout(install,250)};if(base.contentDocument?.readyState==='complete')enterBase();base.addEventListener('load',enterBase);setTimeout(enterBase,250)}
root.addEventListener('load',boot);if(root.contentDocument?.readyState==='complete')boot();
</script></body></html>
