  body{overflow:auto!important}main{max-width:none!important;height:auto!important;overflow:visible!important;padding:0!important}.desktopShell{display:block!important;height:auto!important}.desktopMain{height:auto!important;min-height:100vh!important;overflow:visible!important;padding:58px 10px 12px!important}.desktopMain>h1,.desktopMain>h1+p,.desktopMain>.card:first-of-type{display:none!important}.desktopSide{position:fixed!important;z-index:1002!important;left:0!important;top:0!important;bottom:0!important;width:min(82vw,310px)!important;height:100vh!important;border-radius:0 14px 14px 0!important;transform:translateX(-104%)!important;transition:transform .2s ease!important;box-shadow:12px 0 30px rgba(0,0,0,.35)!important;padding:16px!important}.desktopShell.mobileMenuOpen .desktopSide{transform:translateX(0)!important}.desktopSide .desktopPicker{display:none!important}.desktopNav{display:flex!important;flex-direction:column!important;gap:6px!important;overflow:visible!important;padding:14px 0 0!important;position:static!important;background:transparent!important}.desktopNav button{width:100%!important;white-space:nowrap!important;text-align:left!important;font-size:15px!important;padding:12px 11px!important}.desktopFoot{display:none!important}.mobileTopFG{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:center;position:fixed;z-index:1000;left:0;right:0;top:0;height:52px;padding:6px 10px;background:#07101d;border-bottom:1px solid #26364f}.mobileTopFG button{background:#172033!important;color:#fff!important;padding:8px!important;font-size:20px!important;line-height:1!important}.mobileTopFG select{width:100%;min-width:0;background:#0b1525;color:#fff;border:1px solid #40516b;border-radius:9px;padding:8px 9px;font:inherit;font-weight:800}.mobileShadeFG{position:fixed;z-index:1001;inset:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:opacity .2s}.desktopShell.mobileMenuOpen~.mobileShadeFG{opacity:1;pointer-events:auto}.de  };
