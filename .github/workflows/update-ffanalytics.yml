name: Update ffanalytics ROS projections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-ffanalytics.yml'
      - 'scripts/update_ffanalytics.R'
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: write

jobs:
  update-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          install.packages(c('remotes','jsonlite','dplyr','tidyr'))
          remotes::install_github('FantasyFootballAnalytics/ffanalytics', upgrade = 'never')
        shell: Rscript {0}

      - name: Build equal-average source-stat dataset
        run: Rscript scripts/update_ffanalytics.R

      - name: Validate generated JSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/ffanalytics_projections.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.schema_version!=='2.0') throw new Error('Unexpected ffanalytics schema: '+d.schema_version);
          if(!Array.isArray(d.players)||d.players.length<25) throw new Error('Too few projection rows; refusing to overwrite dataset');
          const withStats=d.players.filter(x=>x.consensus_stats && Object.keys(x.consensus_stats).length>0);
          if(withStats.length<25) throw new Error('Too few rescorable player stat rows; refusing to overwrite dataset');
          const offensive=withStats.filter(x=>['QB','RB','WR','TE'].includes(String(x.position).toUpperCase()));
          const core=offensive.filter(x=>['pass_yds','rush_yds','rec_yds','rec'].some(k=>Number.isFinite(Number(x.consensus_stats[k]))));
          if(core.length<20) throw new Error('Core offensive projection stats are missing; refusing to overwrite dataset');
          console.log(`Validated ${withStats.length} players with rescorable consensus stats from ${(d.working_sources||[]).length} sources`);
          NODE

      - name: Commit refreshed dataset
        run: |
          if git diff --quiet -- data/ffanalytics_projections.json; then
            echo 'No projection changes to commit.'
            exit 0
          fi
          git config user.name 'fantasy-guru-bot'
          git config user.email 'fantasy-guru-bot@users.noreply.github.com'
          git add data/ffanalytics_projections.json
          git commit -m 'Refresh ffanalytics source-stat consensus'
          git push
