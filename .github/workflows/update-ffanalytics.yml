name: Update ffanalytics projections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-ffanalytics.yml'
      - 'scripts/update_ffanalytics.R'
      - 'scripts/update_ffanalytics_weekly.R'
      - 'scripts/update_player_identity_map.mjs'
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: write

jobs:
  update-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical player identity map
        run: node scripts/update_player_identity_map.mjs

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          install.packages(c('remotes','jsonlite','dplyr','tidyr'))
        shell: Rscript {0}

      - name: Install ffanalytics
        run: |
          git clone --depth 1 --branch master https://github.com/FantasyFootballAnalytics/ffanalytics.git /tmp/ffanalytics
          Rscript -e "remotes::install_local('/tmp/ffanalytics', dependencies=TRUE, upgrade='never')"

      - name: Build ROS source-stat dataset
        run: Rscript scripts/update_ffanalytics.R

      - name: Build weekly source-stat dataset
        run: Rscript scripts/update_ffanalytics_weekly.R

      - name: Validate generated JSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const identity=JSON.parse(fs.readFileSync('data/player_identity_map.json','utf8'));
          if(identity.schema_version!=='1.0') throw new Error('Unexpected identity-map schema: '+identity.schema_version);
          if(!Array.isArray(identity.players)||identity.players.length<500) throw new Error('Too few identity-map rows; refusing to overwrite dataset');
          const sleeperIds=identity.players.filter(x=>x.sleeper_id).length;
          const espnIds=identity.players.filter(x=>x.espn_id).length;
          const gsisIds=identity.players.filter(x=>x.gsis_id).length;
          if(sleeperIds<500||espnIds<100||gsisIds<100) throw new Error('Identity-map provider coverage is unexpectedly low');
          console.log(`Validated data/player_identity_map.json: ${identity.players.length} players; Sleeper ${sleeperIds}, ESPN ${espnIds}, GSIS ${gsisIds}`);

          for (const p of ['data/ffanalytics_projections.json','data/ffanalytics_weekly.json']) {
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            if(d.schema_version!=='2.0') throw new Error('Unexpected ffanalytics schema in '+p+': '+d.schema_version);
            if(!Array.isArray(d.players)||d.players.length<25) throw new Error('Too few projection rows in '+p+'; refusing to overwrite dataset');
            const withStats=d.players.filter(x=>x.consensus_stats && Object.keys(x.consensus_stats).length>0);
            if(withStats.length<25) throw new Error('Too few rescorable player stat rows in '+p+'; refusing to overwrite dataset');
            const offensive=withStats.filter(x=>['QB','RB','WR','TE'].includes(String(x.position).toUpperCase()));
            const core=offensive.filter(x=>['pass_yds','rush_yds','rec_yds','rec'].some(k=>Number.isFinite(Number(x.consensus_stats[k]))));
            if(core.length<20) throw new Error('Core offensive projection stats are missing in '+p+'; refusing to overwrite dataset');
            if(p.includes('weekly') && (!Number.isFinite(Number(d.week)) || Number(d.week)<1)) throw new Error('Weekly dataset missing valid week');
            console.log(`Validated ${p}: ${withStats.length} players from ${(d.working_sources||[]).length} sources`);
          }
          NODE

      - name: Commit refreshed datasets
        run: |
          if git diff --quiet -- data/player_identity_map.json data/ffanalytics_projections.json data/ffanalytics_weekly.json; then
            echo 'No projection or identity changes to commit.'
            exit 0
          fi
          git config user.name 'fantasy-guru-bot'
          git config user.email 'fantasy-guru-bot@users.noreply.github.com'
          git add data/player_identity_map.json data/ffanalytics_projections.json data/ffanalytics_weekly.json
          git commit -m 'Refresh player identity map and projection consensus'
          git push
