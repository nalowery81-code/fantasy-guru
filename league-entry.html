<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Guru</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font:14px system-ui}iframe{width:100%;height:100%;border:0;display:block}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#07101d;z-index:5;font-weight:800}#loading span{color:#94a3b8;font-weight:500;display:block;margin-top:6px;text-align:center}</style></head><body><div id="loading">Opening league…<span>Loading trusted projections and league settings.</span></div><iframe id="app" src="/decision-engine.html?entry=3"></iframe><script>const wanted=Number(new URLSearchParams(location.search).get('league'));const app=document.getElementById('app'),loading=document.getElementById('loading');let opened=false,tries=0;function guruWindow(){try{const de=app.contentDocument,x=de?.getElementById('x'),fg=x?.contentDocument,root=fg?.getElementById('root'),core=root?.contentDocument,base=core?.getElementById('base'),desk=base?.contentDocument,guru=desk?.getElementById('guru');return guru?.contentWindow||null}catch{return null}}function tick(){tries++;try{const w=guruWindow();if(w&&typeof w.openL==='function'&&Number.isFinite(wanted)&&wanted>=0){let count=0;try{count=w.eval('LS.length')}catch{}if(count>wanted&&!opened){opened=true;Promise.resolve(w.openL(wanted)).finally(()=>setTimeout(()=>loading.style.display='none',500));return}}}catch{}if(tries<200)setTimeout(tick,100);else{loading.innerHTML='Could not open that league.<span><a href="/league-gate.html" style="color:#7dd3fc">Return to league selection</a></span>'}}app.addEventListener('load',()=>setTimeout(tick,150));tick();</script><script src="/decision-patch.js?v=3"></script><script>(function(){const FACTS={ARI:['The Cardinals trace their roots to 1898, making them the NFL’s oldest continuously run franchise.','They have played in Chicago, St. Louis and Arizona.'],ATL:['The Falcons joined the NFL in 1966.','Their name was chosen through a fan contest.'],BAL:['The Ravens began play in Baltimore in 1996.','Their name honors Edgar Allan Poe, who lived and died in Baltimore.'],BUF:['Buffalo reached four straight Super Bowls from the 1990–1993 seasons.','Bills fans are famously known as Bills Mafia.'],CAR:['The Panthers began play in 1995.','Their first home season was played at Clemson before their Charlotte stadium opened.'],CHI:['The Bears are one of only two original 1920 NFL franchises still operating.','They were originally called the Decatur Staleys.'],CIN:['The Bengals were founded by legendary coach Paul Brown.','The team name revived an earlier Cincinnati pro football name.'],CLE:['The Browns are named after coach and co-founder Paul Brown.','Their orange helmets have traditionally carried no logo.'],DAL:['The Cowboys became widely known as America’s Team in the late 1970s.','Their star logo is one of the most recognizable marks in sports.'],DEN:['Denver’s home-field altitude is about a mile above sea level.','The Broncos began play in the AFL in 1960.'],DET:['The Lions have hosted a Thanksgiving game almost every year since 1934.','They moved to Detroit from Portsmouth, Ohio.'],GB:['The Packers are the NFL’s only community-owned franchise.','Lambeau Field is the league’s oldest continuously used stadium.'],HOU:['The Texans began play in 2002, making them the NFL’s newest franchise.','Their name was chosen to reflect the entire state of Texas.'],IND:['The Colts moved from Baltimore to Indianapolis in 1984.','Indianapolis won Super Bowl XLI behind Peyton Manning and coach Tony Dungy.'],JAX:['The Jaguars began play in 1995.','They reached the AFC Championship Game in only their second season.'],KC:['The Chiefs began as the Dallas Texans before moving to Kansas City in 1963.','Arrowhead Stadium is famous for its exceptionally loud crowd.'],LV:['The Raiders have called Oakland, Los Angeles and Las Vegas home.','Their pirate-themed shield has remained remarkably consistent for decades.'],LAC:['The Chargers debuted in Los Angeles in 1960 before spending decades in San Diego.','The lightning-bolt identity has been part of the franchise since its beginning.'],LA:['The Rams introduced painted horn designs on their helmets in 1948.','The franchise has played in Cleveland, Los Angeles and St. Louis.'],MIA:['The 1972 Dolphins remain the only team to complete a perfect season through the Super Bowl.','Miami joined the AFL in 1966.'],MIN:['The Vikings joined the NFL in 1961.','Their “Skol” chant reflects Minnesota’s strong Scandinavian heritage.'],NE:['The Patriots began as the Boston Patriots in the AFL in 1960.','They changed to New England Patriots after moving to Foxborough.'],NO:['The Saints were awarded to New Orleans on November 1, 1966—All Saints’ Day.','Their fleur-de-lis logo reflects the city’s French heritage.'],NYG:['The Giants were founded in 1925.','They are one of the NFL’s oldest continuously operating franchises.'],NYJ:['The Jets won Super Bowl III after Joe Namath famously guaranteed victory.','They began as the New York Titans.'],PHI:['The Eagles were established in 1933.','The “Philly Special” became one of the most famous plays in Super Bowl history.'],PIT:['The Steelers were founded in 1933.','Their logo is based on the Steelmark used by the American steel industry.'],SF:['The 49ers were named for the prospectors of the 1849 California Gold Rush.','They became the first major-league pro sports franchise based in San Francisco.'],SEA:['Seahawks fans are known as the “12s.”','The franchise entered the NFL in 1976.'],TB:['Tampa Bay became the first team to win a Super Bowl in its home stadium after the 2020 season.','The Buccaneers entered the NFL in 1976.'],TEN:['The Titans franchise began as the Houston Oilers in 1960.','It moved to Tennessee in the late 1990s and adopted the Titans name in 1999.'],WAS:['Washington’s franchise dates to 1932.','It began in Boston before moving to Washington, D.C. in 1937.']};function install(){const w=guruWindow();if(!w)return setTimeout(install,300);const d=w.document;if(!d)return setTimeout(install,300);function paint(){const card=d.querySelector('.fgFav'),sel=d.getElementById('fgFavorite');if(!card||!sel)return;let box=d.getElementById('fgFunFacts');if(!box){box=d.createElement('div');box.id='fgFunFacts';box.style.cssText='margin-top:10px;padding:9px 10px;background:#0b1525;border:1px solid #26364f;border-radius:10px;line-height:1.45';card.appendChild(box)}const f=FACTS[sel.value]||[];box.innerHTML=f.length?'<div style="font-size:11px;font-weight:900;color:#7dd3fc;margin-bottom:4px">FUN FACTS</div>'+f.map(x=>'<div style="font-size:11px;color:#cbd5e1;margin-top:3px">• '+x+'</div>').join(''):'<div style="font-size:11px;color:#94a3b8">Choose a team to see a couple of fun facts.</div>';if(!sel.dataset.factHook){sel.dataset.factHook='1';sel.addEventListener('change',()=>setTimeout(paint,50))}}paint();new w.MutationObserver(()=>setTimeout(paint,40)).observe(d.body,{childList:true,subtree:true});setInterval(paint,2000)}setTimeout(install,500)})();</script></body></html>
