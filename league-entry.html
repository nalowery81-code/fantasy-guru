<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Guru</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font:14px system-ui}iframe{width:100%;height:100%;border:0;display:block}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#07101d;z-index:5;font-weight:800}#loading span{color:#94a3b8;font-weight:500;display:block;margin-top:6px;text-align:center}</style></head><body><div id="loading">Opening league…<span>Loading trusted projections and league settings.</span></div><iframe id="app" src="/decision-engine.html?entry=1"></iframe><script>const wanted=Number(new URLSearchParams(location.search).get('league'));const app=document.getElementById('app'),loading=document.getElementById('loading');let opened=false,tries=0;function tick(){tries++;try{const de=app.contentDocument,x=de?.getElementById('x'),fg=x?.contentDocument,root=fg?.getElementById('root'),core=root?.contentDocument,base=core?.getElementById('base'),desk=base?.contentDocument,guru=desk?.getElementById('guru'),w=guru?.contentWindow;if(w&&typeof w.openL==='function'&&Number.isFinite(wanted)&&wanted>=0){let count=0;try{count=w.eval('LS.length')}catch{}if(count>wanted&&!opened){opened=true;Promise.resolve(w.openL(wanted)).finally(()=>setTimeout(()=>loading.style.display='none',500));return}}}catch{}if(tries<200)setTimeout(tick,100);else{loading.innerHTML='Could not open that league.<span><a href="/league-gate.html" style="color:#7dd3fc">Return to league selection</a></span>'}}app.addEventListener('load',()=>setTimeout(tick,150));tick();</script></body></html>
