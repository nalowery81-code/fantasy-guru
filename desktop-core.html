<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Guru</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="base" src="/desktop.html?patched=4"></iframe><script>
const base=document.getElementById('base');
function install(){
 const bd=base.contentDocument;if(!bd)return;
 const guru=bd.getElementById('guru');if(!guru){setTimeout(install,80);return}
 const patch=()=>{
  const d=guru.contentDocument,w=guru.contentWindow;if(!d||!w)return;
  const main=d.querySelector('main'),side=d.querySelector('.desktopSide'),shell=d.querySelector('.desktopShell'),content=d.querySelector('.desktopMain'),status=d.getElementById('status');
  const oldLeague=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')?.textContent.trim()==='My Leagues');if(oldLeague)oldLeague.style.display='none';
  if(main){main.style.maxWidth='none';main.style.margin='0';main.style.padding='0'}
  if(shell){shell.style.gridTemplateColumns='220px minmax(0,1fr)';shell.style.gap='0';shell.style.height='100vh'}
  if(side){side.style.borderRadius='0';side.style.borderTop='0';side.style.borderLeft='0';side.style.borderBottom='0';side.style.height='100vh'}
  if(content){content.style.padding='14px 18px 18px';const h1=content.querySelector(':scope > h1');const p=h1?.nextElementSibling;if(h1)h1.style.display='none';if(p?.classList.contains('muted'))p.style.display='none'}
  if(status)status.style.display='none';
  const app=d.getElementById('app'),dash=d.getElementById('dashboardPanel'),box=d.getElementById('dashBox'),sel=d.getElementById('desktopLeague');
  if(dash&&app&&dash.parentElement===app&&content)content.insertBefore(dash,app);
  if(dash){dash.style.height='calc(100vh - 32px)';dash.style.overflow='auto';dash.style.padding='14px';const h2=dash.querySelector('h2');const sub=dash.querySelector('p');if(h2)h2.textContent='🏈 Fantasy Guru';if(sub)sub.textContent='Your fantasy football command center.'}
  let extraStyle=d.getElementById('fgDashStyles');if(!extraStyle){extraStyle=d.createElement('style');extraStyle.id='fgDashStyles';extraStyle.textContent=`
   .fgGrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}.fgCard{background:#07101d;border:1px solid #26364f;border-radius:13px;padding:13px}.fgCard h3{margin:0 0 8px;font-size:16px}.fgLeague{grid-column:span 7}.fgFav{grid-column:span 5}.fgSchedule{grid-column:span 7}.fgNews{grid-column:span 5}.fgAsk{grid-column:span 12}.fgSmall{font-size:11px;color:#94a3b8}.fgRow{padding:7px 0;border-bottom:1px solid #26364f}.fgRow:last-child{border-bottom:0}.fgHeadline{display:block;color:#dbeafe;text-decoration:none;font-weight:800;margin-bottom:2px}.fgHeadline:hover{color:#7dd3fc}.fgSelect,.fgInput{width:100%;background:#0b1525;color:#fff;border:1px solid #40516b;border-radius:9px;padding:9px;font:inherit}.fgButton{background:#22c55e;color:#052e16;border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.fgButton.secondary{background:#172033;color:#e2e8f0;border:1px solid #334155}.fgQuick{display:grid;grid-template-columns:1fr auto;gap:8px}.fgModal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99999}.fgModalCard{width:min(520px,92vw);background:#101b2d;border:1px solid #40516b;border-radius:15px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.45)}.fgFields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fgFields .wide{grid-column:1/-1}.fgActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.fgBadge{display:inline-block;padding:2px 7px;border-radius:999px;background:#172033;color:#cbd5e1;font-size:10px;font-weight:800}.fgEmpty{color:#94a3b8;padding:8px 0}.fgTeamSelect{margin-top:8px}.desktopAddLeague{width:100%;margin-top:8px;background:#172033!important;color:#e2e8f0!important;border:1px solid #334155!important;padding:8px 10px!important;font-size:12px!important}
   .fgLeagueList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.fgLeagueTile{background:#0b1525;border:1px solid #334155;border-radius:11px;padding:10px;text-align:left;color:#fff;cursor:pointer}.fgLeagueTile:hover{border-color:#38bdf8;background:#0f1b2e}.fgLeagueTile.active{border-color:#38bdf8;box-shadow:0 0 0 1px #38bdf8 inset}.fgLeagueTile b{display:block;font-size:14px;margin-bottom:2px}.fgLeagueMeta{font-size:11px;color:#94a3b8}.fgLeagueHubActions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
   @media(max-width:900px){.fgLeague,.fgFav,.fgSchedule,.fgNews,.fgAsk{grid-column:1/-1}.fgFields{grid-template-columns:1fr}.fgFields .wide{grid-column:auto}.fgQuick{grid-template-columns:1fr}.fgLeagueList{grid-template-columns:1fr}}
  `;d.head.appendChild(extraStyle)}

  const readStored=()=>{try{return JSON.parse(localStorage.getItem('fg-custom-leagues')||'[]')}catch{return[]}};
  const pushStored=()=>{const stored=readStored();let current=[];try{current=w.eval('LS')}catch{};for(const x of stored){if(!current.some(y=>String(y.id)===String(x.id)&&y.platform===x.platform)){try{w.eval('LS.push('+JSON.stringify(x)+')')}catch{}}}}
  pushStored();
  function allLeagues(){try{return w.eval('LS')||[]}catch{return[]}}
  function rebuildLeagueSelect(){if(!sel)return;const leagues=allLeagues();let current=-1;try{const C=w.eval('C');if(C)current=leagues.findIndex(x=>String(x.id)===String(C.league.id)&&x.platform===C.platform)}catch{};sel.innerHTML='<option value="">Choose a league…</option>'+leagues.map((x,i)=>'<option value="'+i+'">'+x.name+' — '+x.team+'</option>').join('');if(current>=0)sel.value=String(current)}
  function openLeagueFromHub(i){if(sel)sel.value=String(i);w.openL(Number(i))}
  rebuildLeagueSelect();
  if(side&&!d.getElementById('desktopAddLeague')){const b=d.createElement('button');b.id='desktopAddLeague';b.className='desktopAddLeague';b.textContent='+ Add a League';const picker=side.querySelector('.desktopPicker');picker?.appendChild(b);b.onclick=showAddLeague}

  function showAddLeague(){if(d.getElementById('fgLeagueModal'))return;const modal=d.createElement('div');modal.id='fgLeagueModal';modal.className='fgModal';modal.innerHTML='<div class="fgModalCard"><div style="font-size:21px;font-weight:950;margin-bottom:4px">Add a League</div><div class="fgSmall" style="margin-bottom:13px">Add a Sleeper or ESPN league. You can find the league ID in the league URL.</div><div class="fgFields"><div><label class="fgSmall">Platform</label><select id="fgPlatform" class="fgSelect"><option>Sleeper</option><option>ESPN</option></select></div><div><label class="fgSmall">League ID</label><input id="fgLeagueId" class="fgInput" placeholder="League ID"></div><div><label class="fgSmall">Your roster/team ID</label><input id="fgRosterId" class="fgInput" placeholder="Example: 10"></div><div><label class="fgSmall">Team name</label><input id="fgTeamName" class="fgInput" placeholder="Optional"></div><div class="wide"><label class="fgSmall">League name</label><input id="fgLeagueName" class="fgInput" placeholder="Optional — Sleeper can auto-detect"></div></div><div id="fgAddMsg" class="fgSmall" style="margin-top:9px"></div><div class="fgActions"><button id="fgCancel" class="fgButton secondary">Cancel</button><button id="fgSave" class="fgButton">Add League</button></div></div>';d.body.appendChild(modal);modal.querySelector('#fgCancel').onclick=()=>modal.remove();modal.querySelector('#fgSave').onclick=async()=>{const platform=modal.querySelector('#fgPlatform').value,id=modal.querySelector('#fgLeagueId').value.trim(),rid=Number(modal.querySelector('#fgRosterId').value.trim()),msg=modal.querySelector('#fgAddMsg'),save=modal.querySelector('#fgSave');let name=modal.querySelector('#fgLeagueName').value.trim(),team=modal.querySelector('#fgTeamName').value.trim();if(!id||!Number.isFinite(rid)||rid<=0){msg.textContent='League ID and your roster/team ID are required.';return}save.disabled=true;msg.textContent='Checking league…';try{if(platform==='Sleeper'){const r=await fetch('https://api.sleeper.app/v1/league/'+encodeURIComponent(id));if(!r.ok)throw Error('Sleeper league not found');const l=await r.json();name=name||l.name||('Sleeper League '+id);if(!team){const [users,rosters]=await Promise.all([fetch('https://api.sleeper.app/v1/league/'+id+'/users').then(r=>r.json()),fetch('https://api.sleeper.app/v1/league/'+id+'/rosters').then(r=>r.json())]);const rr=rosters.find(x=>Number(x.roster_id)===rid),u=users.find(x=>String(x.user_id)===String(rr?.owner_id));team=u?.metadata?.team_name||u?.display_name||u?.username||('Roster '+rid)}}else{name=name||('ESPN League '+id);team=team||('Team '+rid)}const item={platform,id,name,rid,team};const stored=readStored();if(!stored.some(x=>x.platform===platform&&String(x.id)===String(id)))stored.push(item);localStorage.setItem('fg-custom-leagues',JSON.stringify(stored));try{const leagues=w.eval('LS');if(!leagues.some(x=>x.platform===platform&&String(x.id)===String(id)))w.eval('LS.push('+JSON.stringify(item)+')')}catch{}rebuildLeagueSelect();modal.remove();renderDashboard()}catch(e){msg.textContent=e.message||'Could not add league.';save.disabled=false}}}

  const teams=['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAX','KC','LV','LAC','LA','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SF','SEA','TB','TEN','WAS'];
  const favorite=()=>localStorage.getItem('fg-favorite-team')||'';
  function fmtGame(e){const c=e.competitions?.[0],a=c?.competitors||[],away=a.find(x=>x.homeAway==='away'),home=a.find(x=>x.homeAway==='home'),date=e.date?new Date(e.date):null;return{away:away?.team?.abbreviation||away?.team?.shortDisplayName||'Away',home:home?.team?.abbreviation||home?.team?.shortDisplayName||'Home',date:date?date.toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'}):'',status:c?.status?.type?.shortDetail||''}}
  let nflGames=[],news=[];
  async function loadPublic(){try{const [s,n]=await Promise.all([fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard').then(r=>r.json()),fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=8').then(r=>r.json())]);nflGames=s.events||[];news=n.articles||[];renderDashboard()}catch{renderDashboard()}}

  function wireQuickAsk(){const btn=d.getElementById('fgQuickAsk'),q=d.getElementById('fgQuickQ'),ans=d.getElementById('fgQuickAns');if(!btn||!q||!ans)return;btn.onclick=()=>{let C=null;try{C=w.eval('C')}catch{};if(!C){ans.style.display='block';ans.textContent='Choose a league first for league-specific advice.';return}const originalQ=d.getElementById('question'),originalAsk=d.getElementById('ask'),originalAns=d.getElementById('answer');if(!q.value.trim()||!originalQ||!originalAsk)return;originalQ.value=q.value.trim();ans.style.display='block';ans.textContent='Guru is researching…';btn.disabled=true;originalAsk.click();const sync=()=>{if(originalAns&&!originalAns.classList.contains('hidden')){const t=originalAns.textContent||'';ans.textContent=t;if(!t.includes('researching'))btn.disabled=false}};const obs=new w.MutationObserver(sync);if(originalAns)obs.observe(originalAns,{childList:true,subtree:true,characterData:true,attributes:true});setTimeout(()=>{sync();obs.disconnect();btn.disabled=false},30000)}}

  function renderDashboard(){if(!box)return;let C=null;try{C=w.eval('C')}catch{};const leagues=allLeagues(),activeIndex=C?leagues.findIndex(x=>String(x.id)===String(C.league.id)&&x.platform===C.platform):-1;const leagueTiles=leagues.map((x,i)=>'<button class="fgLeagueTile '+(i===activeIndex?'active':'')+'" data-league="'+i+'"><b>'+x.name+'</b><div class="fgLeagueMeta">'+x.team+' · '+x.platform+'</div></button>').join('');const fav=favorite(),favGames=nflGames.filter(e=>{const g=fmtGame(e);return g.away===fav||g.home===fav}).slice(0,2);box.style.display='block';box.innerHTML='<div class="fgGrid"><section class="fgCard fgLeague"><div class="fgLeagueHubActions"><h3>🏆 League Hub</h3><button id="fgHubAdd" class="fgButton secondary">+ Add League</button></div><div class="fgLeagueList">'+leagueTiles+'</div>'+(C?'<div class="fgSmall" style="margin-top:10px">Open now: <b style="color:#e2e8f0">'+C.league.name+'</b> · '+C.my_team.team+' · '+C.my_team.record.wins+'-'+C.my_team.record.losses+'</div>':'<div class="fgSmall" style="margin-top:10px">Click a league above to open it.</div>')+'</section><section class="fgCard fgFav"><h3>⭐ Favorite NFL Team</h3><select id="fgFavorite" class="fgSelect fgTeamSelect"><option value="">Choose a team…</option>'+teams.map(t=>'<option '+(t===fav?'selected':'')+'>'+t+'</option>').join('')+'</select><div style="margin-top:8px">'+(fav?(favGames.length?favGames.map(e=>{const g=fmtGame(e);return'<div class="fgRow"><b>'+g.away+' @ '+g.home+'</b><div class="fgSmall">'+g.date+' · '+g.status+'</div></div>'}).join(''):'<div class="fgEmpty">No game found in the current scoreboard window.</div>'):'<div class="fgEmpty">Pick your favorite team to pin its schedule here.</div>')+'</div></section><section class="fgCard fgSchedule"><h3>📅 NFL Schedule</h3>'+(nflGames.length?nflGames.slice(0,7).map(e=>{const g=fmtGame(e);return'<div class="fgRow"><b>'+g.away+' @ '+g.home+'</b><div class="fgSmall">'+g.date+' · '+g.status+'</div></div>'}).join(''):'<div class="fgEmpty">Loading the current NFL schedule…</div>')+'</section><section class="fgCard fgNews"><h3>📰 NFL & Fantasy Watch</h3>'+(news.length?news.slice(0,6).map(a=>'<div class="fgRow"><a class="fgHeadline" href="'+(a.links?.web?.href||'#')+'" target="_blank" rel="noopener">'+a.headline+'</a><div class="fgSmall">'+(a.description||'').slice(0,115)+'</div></div>').join(''):'<div class="fgEmpty">Loading current headlines…</div>')+'</section><section class="fgCard fgAsk"><h3>🧠 Quick Ask Guru</h3><div class="fgQuick"><input id="fgQuickQ" class="fgInput" placeholder="Ask about this league, a trade, lineup, waiver move…"><button id="fgQuickAsk" class="fgButton">Ask</button></div><div id="fgQuickAns" style="display:none;white-space:pre-wrap;line-height:1.55;margin-top:10px;background:#0b1525;border:1px solid #26364f;border-radius:10px;padding:11px"></div></section></div>';d.querySelectorAll('.fgLeagueTile').forEach(b=>b.onclick=()=>openLeagueFromHub(Number(b.dataset.league)));const hubAdd=d.getElementById('fgHubAdd');if(hubAdd)hubAdd.onclick=showAddLeague;const fs=d.getElementById('fgFavorite');if(fs)fs.onchange=()=>{localStorage.setItem('fg-favorite-team',fs.value);renderDashboard()};wireQuickAsk()}

  renderDashboard();loadPublic();
  if(sel&&!sel.dataset.homePatch){sel.dataset.homePatch='1';sel.addEventListener('change',()=>setTimeout(renderDashboard,180))}
  if(app&&!app.dataset.homePatch){app.dataset.homePatch='1';new w.MutationObserver(()=>setTimeout(renderDashboard,60)).observe(app,{childList:true,subtree:true,characterData:true})}
 };
 if(guru.contentDocument?.readyState==='complete')patch();guru.addEventListener('load',patch);setTimeout(patch,150);setTimeout(patch,700)
}
base.addEventListener('load',install);if(base.contentDocument?.readyState==='complete')install();
</script></body></html>
