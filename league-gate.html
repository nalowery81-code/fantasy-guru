<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Guru</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07101d;color:#f8fafc;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(760px,100%)}.brand{text-align:center;margin-bottom:22px}.brand h1{font-size:34px;margin:0 0 6px}.brand p{margin:0;color:#94a3b8}.panel{background:#101b2d;border:1px solid #26364f;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h2{margin:0 0 12px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.league{background:#0b1525;border:1px solid #334155;border-radius:13px;padding:16px;text-align:left;color:#fff;cursor:pointer;min-height:82px}.league:hover{border-color:#38bdf8;background:#0f1b2e}.league b{display:block;font-size:16px;margin-bottom:5px}.meta,.small{font-size:12px;color:#94a3b8}.add{width:100%;margin-top:12px;background:#172033;color:#e2e8f0;border:1px solid #334155;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer}.form{display:none;margin-top:12px;padding:14px;background:#0b1525;border:1px solid #334155;border-radius:13px}.form.open{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.wide{grid-column:1/-1}label{display:block;font-size:11px;color:#94a3b8;margin-bottom:4px}input,select{width:100%;background:#07101d;color:#fff;border:1px solid #40516b;border-radius:9px;padding:10px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer;background:#22c55e;color:#052e16}.btn.secondary{background:#172033;color:#e2e8f0;border:1px solid #334155}#msg{margin-top:8px}@media(max-width:640px){.grid,.fields{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><div class="brand"><h1>🏈 Fantasy Guru</h1><p>Choose a league to get started.</p></div><section class="panel"><h2>Your Leagues</h2><div id="grid" class="grid"></div><button id="add" class="add">+ Add a League</button><div id="form" class="form"><div class="small">Add a Sleeper or ESPN league. Sleeper can auto-detect the league and team name.</div><div class="fields"><div><label>Platform</label><select id="p"><option>Sleeper</option><option>ESPN</option></select></div><div><label>League ID</label><input id="lid" placeholder="League ID"></div><div><label>Your roster/team ID</label><input id="rid" placeholder="Example: 10"></div><div><label>Team name</label><input id="team" placeholder="Optional"></div><div class="wide"><label>League name</label><input id="name" placeholder="Optional"></div></div><div id="msg" class="small"></div><div class="actions"><button id="cancel" class="btn secondary">Cancel</button><button id="save" class="btn">Add League</button></div></div></section></main><script>const BASE=[{platform:'Sleeper',id:'1389377608638042112',name:'GridIron Throne',rid:10,team:'Tennesee Turf Trotters'},{platform:'Sleeper',id:'1389387047789162497',name:'SouthCentral War Room',rid:1,team:'Plumbers “Crack”n Boys'},{platform:'ESPN',id:'1673474732',name:'DGH Invitational 2026',rid:15,team:'CeeDees Nuts'}];const stored=()=>{try{return JSON.parse(localStorage.getItem('fg-custom-leagues')||'[]')}catch{return[]}};function leagues(){const out=[...BASE];for(const x of stored())if(!out.some(y=>y.platform===x.platform&&String(y.id)===String(x.id)))out.push(x);return out}function render(){grid.innerHTML=leagues().map((x,i)=>'<button class="league" data-i="'+i+'"><b>'+x.name+'</b><span class="meta">'+x.team+' · '+x.platform+'</span></button>').join('');grid.querySelectorAll('.league').forEach(b=>b.onclick=()=>{location.href='/league-entry.html?league='+b.dataset.i})}render();add.onclick=()=>form.classList.add('open');cancel.onclick=()=>{form.classList.remove('open');msg.textContent=''};save.onclick=async()=>{const platform=p.value,id=lid.value.trim(),rosterId=Number(rid.value),m=msg;let leagueName=name.value.trim(),teamName=team.value.trim();if(!id||!Number.isFinite(rosterId)||rosterId<=0){m.textContent='League ID and your roster/team ID are required.';return}save.disabled=true;m.textContent='Checking league…';try{if(platform==='Sleeper'){const lr=await fetch('https://api.sleeper.app/v1/league/'+encodeURIComponent(id));if(!lr.ok)throw Error('Sleeper league not found');const l=await lr.json();leagueName=leagueName||l.name||('Sleeper League '+id);if(!teamName){const [u,r]=await Promise.all([fetch('https://api.sleeper.app/v1/league/'+id+'/users').then(x=>x.json()),fetch('https://api.sleeper.app/v1/league/'+id+'/rosters').then(x=>x.json())]);const rr=r.find(x=>Number(x.roster_id)===rosterId),us=u.find(x=>String(x.user_id)===String(rr?.owner_id));teamName=us?.metadata?.team_name||us?.display_name||us?.username||('Roster '+rosterId)}}else{leagueName=leagueName||('ESPN League '+id);teamName=teamName||('Team '+rosterId)}const item={platform,id,name:leagueName,rid:rosterId,team:teamName},s=stored();if(!s.some(x=>x.platform===platform&&String(x.id)===String(id)))s.push(item);localStorage.setItem('fg-custom-leagues',JSON.stringify(s));form.classList.remove('open');lid.value=rid.value=team.value=name.value='';m.textContent='';render()}catch(e){m.textContent=e.message||'Could not add league.'}finally{save.disabled=false}};</script></body></html>
